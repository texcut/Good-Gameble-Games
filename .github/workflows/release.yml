name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.14.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Test
        run: bash scripts/swift-tool.sh test
      - name: Prepare archives
        run: bash scripts/prepare-release.sh
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/Good-Gameble-Games-v*.zip dist/SHA256SUMS --verify-tag --draft --prerelease --title "Good Gameble Games $RELEASE_TAG · Early access" --notes-file .github/RELEASE_NOTES.md
